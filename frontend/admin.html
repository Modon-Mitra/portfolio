<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Abhijeet Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#03060e;--bg2:#080d18;--card:#0e1525;
  --border:rgba(255,255,255,.06);--border2:rgba(0,229,255,.15);
  --cyan:#00e5ff;--purple:#9d4edd;--pink:#f72585;
  --green:#00f5a0;--amber:#ffbe0b;
  --text:#e8eaf6;--muted:#546e8a;
  --font-display:'Syne',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;}

/* LOGIN */
#login-screen{
  position:fixed;inset:0;z-index:100;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
}
.login-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:3rem;width:380px;text-align:center;
}
.login-logo{
  font-family:var(--font-display);font-size:2rem;
  font-weight:800;margin-bottom:.3rem;
}
.login-logo span{color:var(--cyan);}
.login-sub{color:var(--muted);font-size:.82rem;margin-bottom:2rem;font-family:var(--font-mono);}
.login-input{
  width:100%;background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;padding:.9rem 1.2rem;color:var(--text);
  font-family:var(--font-mono);font-size:.9rem;outline:none;
  margin-bottom:1rem;transition:border-color .25s;
}
.login-input:focus{border-color:var(--cyan);}
.login-btn{
  width:100%;background:var(--cyan);color:#000;border:none;
  padding:.9rem;border-radius:8px;font-weight:700;
  font-family:var(--font-display);font-size:.9rem;
  cursor:pointer;transition:background .2s;
}
.login-btn:hover{background:#00b8d4;}
.login-error{color:var(--pink);font-size:.78rem;margin-top:.8rem;font-family:var(--font-mono);}

/* DASHBOARD */
#dashboard{display:none;}
nav{
  background:rgba(3,6,14,.9);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:1rem 2rem;display:flex;
  justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:50;
}
.nav-brand{font-family:var(--font-display);font-weight:800;font-size:1.1rem;}
.nav-brand span{color:var(--cyan);}
.nav-meta{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);display:flex;gap:1.5rem;align-items:center;}
.live-dot{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.logout-btn{
  font-family:var(--font-mono);font-size:.72rem;
  border:1px solid var(--border);color:var(--muted);
  padding:.4rem .9rem;border-radius:6px;
  background:transparent;cursor:pointer;transition:all .2s;
}
.logout-btn:hover{border-color:var(--pink);color:var(--pink);}

main{max-width:1200px;margin:0 auto;padding:2.5rem 2rem;}

/* STAT CARDS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
.stat-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:1.4rem;
  position:relative;overflow:hidden;
}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
}
.stat-card.c-cyan::before{background:linear-gradient(90deg,var(--cyan),transparent);}
.stat-card.c-purple::before{background:linear-gradient(90deg,var(--purple),transparent);}
.stat-card.c-green::before{background:linear-gradient(90deg,var(--green),transparent);}
.stat-card.c-amber::before{background:linear-gradient(90deg,var(--amber),transparent);}
.stat-icon{font-size:1.5rem;margin-bottom:.8rem;}
.stat-val{
  font-family:var(--font-display);font-size:2.2rem;
  font-weight:800;line-height:1;margin-bottom:.3rem;
}
.stat-val.c-cyan{color:var(--cyan);}
.stat-val.c-purple{color:var(--purple);}
.stat-val.c-green{color:var(--green);}
.stat-val.c-amber{color:var(--amber);}
.stat-label{font-size:.78rem;color:var(--muted);}

/* SECTIONS */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.panel-header{
  padding:1.2rem 1.5rem;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.panel-title{
  font-family:var(--font-display);font-weight:700;font-size:.95rem;
}
.panel-badge{
  font-family:var(--font-mono);font-size:.65rem;
  color:var(--cyan);border:1px solid var(--border2);
  padding:.2rem .6rem;border-radius:999px;
}
.panel-body{padding:1.2rem 1.5rem;max-height:380px;overflow-y:auto;}

/* TABLES */
table{width:100%;border-collapse:collapse;font-size:.82rem;}
th{
  text-align:left;padding:.6rem .8rem;
  font-family:var(--font-mono);font-size:.65rem;
  color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
  border-bottom:1px solid var(--border);
}
td{padding:.7rem .8rem;border-bottom:1px solid rgba(255,255,255,.03);color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
.td-mono{font-family:var(--font-mono);font-size:.75rem;color:var(--muted);}
.del-btn{
  background:none;border:1px solid rgba(247,37,133,.2);
  color:var(--pink);padding:.25rem .6rem;border-radius:5px;
  font-size:.7rem;cursor:pointer;transition:all .2s;font-family:var(--font-mono);
}
.del-btn:hover{background:rgba(247,37,133,.1);}

/* BADGES */
.badge{
  display:inline-block;padding:.2rem .6rem;border-radius:999px;
  font-family:var(--font-mono);font-size:.62rem;font-weight:600;
}
.badge-pos{background:rgba(0,245,160,.08);border:1px solid rgba(0,245,160,.2);color:var(--green);}
.badge-neu{background:rgba(84,110,138,.1);border:1px solid rgba(84,110,138,.3);color:var(--muted);}
.badge-neg{background:rgba(247,37,133,.08);border:1px solid rgba(247,37,133,.2);color:var(--pink);}

/* CLICK BARS */
.click-row{margin-bottom:1rem;}
.click-header{display:flex;justify-content:space-between;margin-bottom:.35rem;font-size:.82rem;}
.click-section{color:var(--text);text-transform:capitalize;}
.click-count{font-family:var(--font-mono);font-size:.75rem;color:var(--cyan);}
.click-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.click-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width 1s;}

/* SENTIMENT PIE VISUAL */
.sentiment-summary{display:flex;gap:1rem;margin-bottom:1.5rem;}
.sent-block{
  flex:1;background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;padding:1rem;text-align:center;
}
.sent-count{font-family:var(--font-display);font-size:1.8rem;font-weight:800;}
.sent-label{font-size:.72rem;color:var(--muted);margin-top:.2rem;}

/* REFRESH BTN */
.refresh-btn{
  font-family:var(--font-mono);font-size:.7rem;
  border:1px solid var(--border);color:var(--muted);
  padding:.35rem .8rem;border-radius:6px;
  background:transparent;cursor:pointer;transition:all .2s;
}
.refresh-btn:hover{border-color:var(--cyan);color:var(--cyan);}
.empty{color:var(--muted);font-size:.85rem;text-align:center;padding:2rem;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">AS<span>.</span>Admin</div>
    <div class="login-sub">// RESTRICTED ACCESS</div>
    <input class="login-input" type="password" id="pwd" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')login()"/>
    <button class="login-btn" onclick="login()">Access Dashboard →</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <nav>
    <div class="nav-brand">AS<span>.</span>Admin</div>
    <div class="nav-meta">
      <span><span class="live-dot"></span> Live</span>
      <span id="last-updated">—</span>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </nav>

  <main>
    <!-- STAT CARDS -->
    <div class="stats-row">
      <div class="stat-card c-cyan">
        <div class="stat-icon">👁️</div>
        <div class="stat-val c-cyan" id="s-visitors">—</div>
        <div class="stat-label">Total Visitors</div>
      </div>
      <div class="stat-card c-purple">
        <div class="stat-icon">💬</div>
        <div class="stat-val c-purple" id="s-comments">—</div>
        <div class="stat-label">Total Comments</div>
      </div>
      <div class="stat-card c-green">
        <div class="stat-icon">✅</div>
        <div class="stat-val c-green" id="s-positive">—</div>
        <div class="stat-label">Positive Feedback</div>
      </div>
      <div class="stat-card c-amber">
        <div class="stat-icon">🖱️</div>
        <div class="stat-val c-amber" id="s-clicks">—</div>
        <div class="stat-label">Total Interactions</div>
      </div>
    </div>

    <!-- ROW 1 -->
    <div class="grid-2">
      <!-- VISITORS -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Recent Visitors</span>
          <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
        </div>
        <div class="panel-body">
          <table>
            <thead><tr><th>#</th><th>IP Address</th><th>Device</th><th>Time</th></tr></thead>
            <tbody id="visitors-table"><tr><td colspan="4" class="empty">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- CLICK STATS -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Section Engagement</span>
          <span class="panel-badge">Dwell Time</span>
        </div>
        <div class="panel-body" id="click-stats">
          <div class="empty">Loading...</div>
        </div>
      </div>
    </div>

    <!-- ROW 2 -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">All Comments</span>
        <span class="panel-badge" id="comment-count-badge">0 messages</span>
      </div>
      <div class="panel-body">
        <!-- Sentiment Summary -->
        <div class="sentiment-summary" id="sentiment-summary"></div>
        <table>
          <thead>
            <tr><th>#</th><th>Name</th><th>Message</th><th>Sentiment</th><th>Date</th><th>Action</th></tr>
          </thead>
          <tbody id="comments-table"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
const API = 'https://abhijeet-portfolio-api.onrender.com/api';
const ADMIN_PASSWORD = 'abhijeet@admin2025';

function login(){
  const pwd = document.getElementById('pwd').value;
  if(pwd === ADMIN_PASSWORD){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadAll();
    setInterval(loadAll, 30000);
  } else {
    document.getElementById('login-error').textContent = 'Incorrect password. Try again.';
  }
}

function logout(){
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('pwd').value = '';
}

async function loadAll(){
  document.getElementById('last-updated').textContent =
    'Updated: ' + new Date().toLocaleTimeString();
  await Promise.all([loadVisitors(), loadComments(), loadClicks()]);
}

async function loadVisitors(){
  try{
    const r = await fetch(`${API}/visitors/count`);
    const d = await r.json();
    document.getElementById('s-visitors').textContent = d.total_visitors;

    const r2 = await fetch(`${API}/visitors/recent`);
    if(r2.ok){
      const visitors = await r2.json();
      const tbody = document.getElementById('visitors-table');
      if(!visitors.length){
        tbody.innerHTML='<tr><td colspan="4" class="empty">No visitors yet.</td></tr>';
        return;
      }
      tbody.innerHTML = visitors.map((v,i)=>`
        <tr>
          <td class="td-mono">${i+1}</td>
          <td class="td-mono">${v.ip_address||'—'}</td>
          <td style="font-size:.75rem;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${(v.device||'—').split(' ').slice(0,4).join(' ')}</td>
          <td class="td-mono">${new Date(v.visited_at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
        </tr>`).join('');
    }
  }catch(e){
    document.getElementById('s-visitors').textContent = '—';
  }
}

async function loadComments(){
  try{
    const r = await fetch(`${API}/comments/all`);
    const comments = await r.json();
    document.getElementById('s-comments').textContent = comments.length;
    document.getElementById('comment-count-badge').textContent = comments.length + ' messages';

    const pos = comments.filter(c=>c.sentiment==='Positive').length;
    const neu = comments.filter(c=>c.sentiment==='Neutral'||c.sentiment==='Pending').length;
    const neg = comments.filter(c=>c.sentiment==='Negative').length;
    document.getElementById('s-positive').textContent = pos;

    document.getElementById('sentiment-summary').innerHTML = `
      <div class="sent-block"><div class="sent-count" style="color:var(--green)">${pos}</div><div class="sent-label">Positive</div></div>
      <div class="sent-block"><div class="sent-count" style="color:var(--muted)">${neu}</div><div class="sent-label">Neutral</div></div>
      <div class="sent-block"><div class="sent-count" style="color:var(--pink)">${neg}</div><div class="sent-label">Negative</div></div>
    `;

    const tbody = document.getElementById('comments-table');
    if(!comments.length){
      tbody.innerHTML='<tr><td colspan="6" class="empty">No comments yet.</td></tr>';
      return;
    }
    const badgeClass = s => s==='Positive'?'badge-pos':s==='Negative'?'badge-neg':'badge-neu';
    tbody.innerHTML = comments.map((c,i)=>`
      <tr>
        <td class="td-mono">${i+1}</td>
        <td style="font-weight:600">${c.name}</td>
        <td style="font-size:.82rem;color:var(--text);max-width:280px;">${c.message.slice(0,80)}${c.message.length>80?'...':''}</td>
        <td><span class="badge ${badgeClass(c.sentiment)}">${c.sentiment||'—'}</span></td>
        <td class="td-mono">${new Date(c.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</td>
        <td><button class="del-btn" onclick="deleteComment(${c.id})">Delete</button></td>
      </tr>`).join('');
  }catch(e){
    document.getElementById('s-comments').textContent = '—';
  }
}

async function loadClicks(){
  try{
    const r = await fetch(`${API}/clicks/stats`);
    const stats = await r.json();
    const total = stats.reduce((a,b)=>a+b.visits,0);
    document.getElementById('s-clicks').textContent = total;

    const max = Math.max(...stats.map(s=>s.visits),1);
    const container = document.getElementById('click-stats');
    if(!stats.length){container.innerHTML='<div class="empty">No click data yet.</div>';return;}
    container.innerHTML = stats
      .sort((a,b)=>b.visits-a.visits)
      .map(s=>`
        <div class="click-row">
          <div class="click-header">
            <span class="click-section">${s.section}</span>
            <span class="click-count">${s.visits} visits · ${s.avg_dwell}s avg</span>
          </div>
          <div class="click-bar">
            <div class="click-fill" style="width:${Math.round(s.visits/max*100)}%"></div>
          </div>
        </div>`).join('');
  }catch(e){
    document.getElementById('s-clicks').textContent = '—';
  }
}

async function deleteComment(id){
  if(!confirm('Delete this comment?')) return;
  try{
    await fetch(`${API}/comments/delete/${id}`,{method:'DELETE'});
    loadComments();
  }catch(e){alert('Could not delete. Make sure backend is running.');}
}
</script>
</body>
</html>
